<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Code Brackets Cyan -> Blue Gradient -->
    <linearGradient id="bracketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Slash Emerald Accent Gradient -->
    <linearGradient id="slashGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter for Crisp Display -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#38BDF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Base: Obsidian Precision Rounded Square -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="7"
    fill="url(#bgGradient)"
    stroke="#1E293B"
    stroke-width="1.5"
  />

  <!-- Subtle Inner Ring Highlight -->
  <rect
    x="2"
    y="2"
    width="28"
    height="28"
    rx="6"
    stroke="#38BDF8"
    stroke-opacity="0.15"
    stroke-width="1"
    fill="none"
  />

  <!-- Code Glyphs: < / > -->
  <g filter="url(#glow)">
    <!-- Left Bracket: < -->
    <path
      d="M10 11.5L5.5 16L10 20.5"
      stroke="url(#bracketGradient)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Forward Slash: / -->
    <path
      d="M18.5 9.5L13.5 22.5"
      stroke="url(#slashGradient)"
      stroke-width="2.3"
      stroke-linecap="round"
    />

    <!-- Right Bracket: > -->
    <path
      d="M22 11.5L26.5 16L22 20.5"
      stroke="url(#bracketGradient)"
      stroke-width="2.3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
